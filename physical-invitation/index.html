<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Танд очих бодит урилга – Leaders Mongolia</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Leaders Mongolia 2026 шинэ жилийн бодит урилга.">
  <meta name="theme-color" content="#1a050b">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <style>
    :root{--bg:#1a050b;--paper:#2b0811;--ink:#fff3dc;--muted:#c9aeb0;--accent:#f2c14e;--f-display:'Cormorant Garamond',serif;--f-body:'Manrope',sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{min-height:100vh;margin:0;background:radial-gradient(circle at 50% 0,rgba(242,193,78,.1),transparent 36%),var(--bg);color:var(--ink);font-family:var(--f-body)}
    .physical-invitation-header{position:relative;isolation:isolate;border-top:3px solid var(--accent);border-bottom:1px solid rgba(242,193,78,.34);background:linear-gradient(90deg,#22070f,#370a17 50%,#22070f);box-shadow:0 18px 50px rgba(0,0,0,.28)}
    .physical-invitation-header::before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 50% 18%,rgba(242,193,78,.12),transparent 34%),linear-gradient(90deg,transparent,rgba(255,255,255,.018),transparent);pointer-events:none}
    .physical-invitation-header::after{content:"◆";position:absolute;left:50%;bottom:-5px;padding:0 9px;background:#2e0914;color:var(--accent);font-size:.52rem;line-height:10px;transform:translateX(-50%)}
    .physical-invitation-header-inner{width:min(100%,1248px);min-height:112px;display:grid;grid-template-columns:minmax(170px,1fr) minmax(280px,1.5fr) minmax(170px,1fr);align-items:center;gap:24px;margin:0 auto;padding:18px clamp(24px,4vw,52px)}
    .physical-invitation-back{width:max-content;display:inline-flex;align-items:center;gap:10px;padding:11px 15px 11px 12px;border:1px solid rgba(242,193,78,.32);border-radius:999px;background:rgba(255,255,255,.025);color:var(--ink);font-size:.62rem;font-weight:600;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;transition:border-color .2s,background .2s,color .2s}
    .physical-invitation-back:hover{border-color:var(--accent);background:rgba(242,193,78,.08);color:var(--accent)}
    .physical-invitation-back svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .physical-invitation-title{position:relative;text-align:center}
    .physical-invitation-title small{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;color:var(--accent);font-size:.55rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
    .physical-invitation-title small::before,.physical-invitation-title small::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
    .physical-invitation-title small::after{transform:scaleX(-1)}
    .physical-invitation-title h1{margin:0;font-family:var(--f-display);font-size:clamp(1.8rem,3vw,2.45rem);font-weight:400;line-height:1;color:var(--ink);letter-spacing:.015em}
    .physical-invitation-mark{justify-self:end;width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(242,193,78,.55);border-radius:50%;color:var(--accent);font-family:var(--f-display);font-size:1.85rem;font-weight:500;text-decoration:none;box-shadow:inset 0 0 0 6px rgba(242,193,78,.045),0 0 28px rgba(242,193,78,.08)}
    .physical-invitation-mark span{transform:translateY(-1px)}
    main{width:min(100%,1248px);margin:0 auto;padding:clamp(18px,4vw,48px)}
    figure{margin:0;overflow:hidden;border:1px solid rgba(242,193,78,.28);border-radius:clamp(18px,3vw,30px);background:var(--paper);box-shadow:0 28px 80px rgba(0,0,0,.42)}
    img{display:block;width:100%;height:auto}
    @media(max-width:680px){.physical-invitation-header{border-top-width:2px}.physical-invitation-header-inner{min-height:92px;grid-template-columns:42px minmax(0,1fr) 42px;gap:10px;padding:12px 14px}.physical-invitation-back{width:42px;height:42px;justify-content:center;padding:0;border-radius:50%}.physical-invitation-back span{display:none}.physical-invitation-title small{gap:6px;font-size:.45rem;letter-spacing:.2em}.physical-invitation-title small::before,.physical-invitation-title small::after{width:14px}.physical-invitation-title h1{font-size:clamp(1.22rem,5.5vw,1.55rem)}.physical-invitation-mark{width:42px;height:42px;font-size:1.35rem;box-shadow:inset 0 0 0 4px rgba(242,193,78,.045)}main{padding:16px 12px 28px}figure{border-radius:18px}}
  </style>
</head>
<body>
  <header class="physical-invitation-header">
    <div class="physical-invitation-header-inner">
      <a class="physical-invitation-back" href="/" aria-label="Урилга руу буцах"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span>Буцах</span></a>
      <div class="physical-invitation-title"><small>Leaders Mongolia · 2026</small><h1>Танд очих бодит урилга</h1></div>
      <a class="physical-invitation-mark" href="/" aria-label="Leaders Mongolia нүүр хуудас"><span>L</span></a>
    </div>
  </header>
  <main>
    <figure><img src="/assets/images/og-invitation.png" width="1200" height="630" alt="Leaders Mongolia 2026 шинэ жилийн урилга"></figure>
  </main>
</body>
</html>
